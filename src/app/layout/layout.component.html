<div class="layout-container">
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <button class="btn btn-outline-light me-3" (click)="toggleSidebar()">
          <i class="fas fa-bars"></i>
        </button>
        <span class="navbar-brand mb-0 h1">Employee Portal</span>
        
        <div class="navbar-nav ms-auto">
          <button class="btn btn-outline-light" (click)="logout()">
            <i class="fas fa-sign-out-alt me-2"></i>Logout
          </button>
        </div>
      </div>
    </nav>
  
    <div class="main-content">
      <!-- Sidebar -->
      <div class="sidebar" [class.sidebar-open]="sidebarOpen">
        <div class="sidebar-header">
          <h5>Navigation</h5>
        </div>
        
        <nav class="sidebar-nav">
          <a class="nav-item" (click)="navigateTo('/dashboard')" routerLinkActive="active">
            <i class="fas fa-tachometer-alt me-2"></i>
            Dashboard
          </a>
          
          <a class="nav-item" (click)="navigateTo('/employee-list')" routerLinkActive="active">
            <i class="fas fa-users me-2"></i>
            Manage Employees
          </a>
          
          <a class="nav-item" (click)="navigateTo('/employee-form')" routerLinkActive="active">
            <i class="fas fa-user-plus me-2"></i>
            Add Employee
          </a>
          
          <a class="nav-item" (click)="navigateTo('/reports')" routerLinkActive="active">
            <i class="fas fa-chart-bar me-2"></i>
            Reports
          </a>
          
          <a class="nav-item" (click)="navigateTo('/settings')" routerLinkActive="active">
            <i class="fas fa-cog me-2"></i>
            Settings
          </a>
        </nav>
      </div>
  
      <!-- Main Content Area -->
      <div class="content-area">
        <router-outlet></router-outlet>
      </div>
    </div>
  
    <!-- Overlay for mobile -->
    <div class="sidebar-overlay" [class.show]="sidebarOpen" (click)="toggleSidebar()"></div>
  </div>
